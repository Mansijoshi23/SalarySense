{% extends "base.html" %}
{% block title %}Log In — SalarySense{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <a class="navbar-logo" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="SalarySense">
    </a>
    <h1>Welcome back</h1>
    <p style="color:var(--text-muted);margin-bottom:22px;">Log in to view your dashboard and prediction history.</p>

    <form method="POST" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-row">
        <label class="checkbox-row">
          <input type="checkbox" name="remember_me">
          Remember me
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-footer-note">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
